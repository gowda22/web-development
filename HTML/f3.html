
<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>

<body>

    <h2>Registration Form</h2>

    <form>

        <label>Name</label><br>
        <input type="text"
               name="name"
               minlength="5"
               maxlength="25"
               required>
        <br><br>

        <label>Age</label><br>
        <input type="number"
               name="age"
               min="18"
               max="60"
               required>
        <br><br>

        <label>Email</label><br>
        <input type="email"
               name="email"
               pattern="[a-zA-Z0-9._%+-]+@gmail\.com"
               required>
        <br><br>

        <label>Password</label><br>
        <input type="password"
               name="password"
               minlength="8"
               required>
        <br><br>

        <button type="submit">Save</button>

    </form>

</body>
</html>
